<h2>Produtos</h2>

<!-- Estado 1: carregando -->

@if(carregando()){
    <p><strong>Carregando produtos, Aguarde...</strong></p>
}

<!-- Estado 2: Erro-->

@if(erro()){
    <p><strong style="color: red;">{{erro() }}" </strong></p> 
    <button (click)="carregarProdutos()">Tentar Novamente</button>
}

@if(!carregando() && !erro()){
    <p><strong>Quantidade de produtos:</strong> {{totalProdutos()}}</p>
    <hr>
    <section class="grid-produtos">
@for(item of produtos(); track $index){
    <app-produto
    [nome]="item.nome"
    [preco]="item.preco"
    (produtoSelecionado)="exibirProduto($event)"
    (produtoAdicionado)="adicionarAoCarrinho($event)"
    >
    </app-produto>
  }
    </section>
}
